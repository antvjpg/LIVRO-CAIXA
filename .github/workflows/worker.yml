name: worker

permissions:
  contents: read

on:
  push:
    paths:
      - "worker/**"
      - "financial-client.js"
      - ".github/workflows/worker.yml"
  pull_request:
    paths:
      - "worker/**"
      - "financial-client.js"
      - ".github/workflows/worker.yml"
  workflow_dispatch:

jobs:
  test-and-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Testes do Worker
        run: node --test worker/test/*.test.mjs

      - name: Dry-run do deploy (empacota sem publicar)
        run: npx --yes wrangler@4 deploy --dry-run
        working-directory: worker


  deploy-production:
    # Deploy automático em push para main (testes sempre como gate);
    # workflow_dispatch continua disponível como gatilho manual.
    # Requer environment "production" configurado no GitHub (Settings → Environments).
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: test-and-dry-run
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Deploy real do Worker
        run: npx --yes wrangler@4 deploy
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
