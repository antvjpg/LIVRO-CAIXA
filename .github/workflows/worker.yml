name: worker

permissions:
  contents: read

on:
  push:
    paths:
      - "worker/**"
      - ".github/workflows/worker.yml"
  pull_request:
    paths:
      - "worker/**"
      - ".github/workflows/worker.yml"
  workflow_dispatch:

jobs:
  test-and-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Testes do Worker
        run: node --test worker/test/*.test.mjs

      - name: Dry-run do deploy (empacota sem publicar)
        run: npx --yes wrangler@4 deploy --dry-run
        working-directory: worker


  deploy-production:
    if: github.event_name == 'workflow_dispatch'
    needs: test-and-dry-run
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Deploy real do Worker
        run: npx --yes wrangler@4 deploy
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
