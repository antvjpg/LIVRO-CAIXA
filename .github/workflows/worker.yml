name: worker

on:
  push:
    paths:
      - "worker/**"
      - ".github/workflows/worker.yml"
  pull_request:
    paths:
      - "worker/**"
      - ".github/workflows/worker.yml"
  workflow_dispatch:

jobs:
  test-and-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Testes do Worker
        run: node --test worker/test/*.test.mjs

      - name: Dry-run do deploy (empacota sem publicar)
        run: npx --yes wrangler@4 deploy --dry-run
        working-directory: worker
