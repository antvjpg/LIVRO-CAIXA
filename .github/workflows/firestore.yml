name: Deploy Firestore Rules

on:
  push:
    branches: [main]
    paths:
      - "firestore.rules"
      - "firebase.json"
      - ".github/workflows/firestore.yml"
  pull_request:
    branches: [main]
    paths:
      - "firestore.rules"
      - "firebase.json"
      - ".github/workflows/firestore.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-firestore-rules:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Validate Firestore Rules
        run: firebase firestore:rules:test --only firestore:firestore.rules || echo "Warning: Rules validation could not complete"

      - name: Deploy Firestore Rules
        if: github.ref == 'refs/heads/main'
        run: firebase deploy --only firestore:rules --project livro-caixa-54357
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
