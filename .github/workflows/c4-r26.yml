name: C.4 — R2.6

on:
  push:
    branches: [feat/app-layout-redesign]
  pull_request:
    branches: [feat/app-layout-redesign]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  r2-6:
    name: Matriz 10 + regressao 393
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Executar suíte R2.6
        run: node e2e/scripts/run-c4-r26.cjs
      - name: Publicar evidências
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: c4-r2-6-evidencias
          path: |
            e2e/.artifacts/r2-6-*.json
            e2e/.artifacts/r2-6-*.log
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
