name: Testes

on:
  push:
    branches: [feat/app-layout-redesign]

permissions:
  contents: read

concurrency:
  group: testes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  iteracao:
    name: Testes de iteração
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CODE_BASE_URL: http://127.0.0.1:8000
      CI: 'true'

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm

      - name: Dependências
        run: npm ci

      - name: Sintaxe
        run: node e2e/scripts/syntax-check.cjs

      - name: Chromium
        run: npx playwright install --with-deps chromium

      - name: Teste Início
        run: npx playwright test e2e/iteracao/inicio.spec.js --config=playwright.iteracao.config.cjs --project=iteracao --reporter=list

      - name: Evidências
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: testes-evidencias
          path: |
            e2e/.artifacts/test-results
            e2e/reports/testes-results.json
          if-no-files-found: warn
          include-hidden-files: true
