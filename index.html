<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Livro-Caixa</title>

  <!-- Google Fonts & Chart.js / jsPDF / PDF.js -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  <style>
    :root {
      --bg-color: #e5e0d4;
      --card-bg: #dcd6c8;
      --border-color: #1a1a1a;
      --text-color: #1a1a1a;
      --btn-green: #2c5e3b;
      --btn-green-hover: #21472c;
      --btn-dark: #222222;
      --btn-bg: #ece7db;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Courier Prime', monospace, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 16px;
      max-width: 600px;
      margin: 0 auto;
    }

    /* Header */
    header {
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 12px;
      margin-bottom: 20px;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
    }

    .date-str {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 4px;
    }

    .user-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
      font-size: 0.85rem;
    }

    .btn-sair {
      background: #fff;
      border: 1.5px solid var(--border-color);
      padding: 4px 12px;
      font-weight: bold;
      cursor: pointer;
      border-radius: 4px;
    }

    /* Cards de Saldo */
    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }

    .card {
      border: 2px solid var(--border-color);
      padding: 12px;
      background-color: var(--card-bg);
      border-radius: 4px;
    }

    .card.total {
      grid-column: span 2;
      background-color: #d1c9b8;
    }

    .card-title {
      font-size: 0.75rem;
      font-weight: bold;
      text-transform: uppercase;
      opacity: 0.8;
    }

    .card-value {
      font-size: 1.4rem;
      font-weight: bold;
      margin-top: 4px;
    }

    /* Botoes de Acao */
    .actions-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 24px;
    }

    .btn {
      border: 2px solid var(--border-color);
      padding: 12px 8px;
      background-color: var(--btn-bg);
      font-weight: bold;
      font-size: 0.8rem;
      cursor: pointer;
      text-transform: uppercase;
      border-radius: 4px;
      box-shadow: 2px 2px 0px var(--border-color);
      transition: all 0.1s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn:active {
      transform: translate(2px, 2px);
      box-shadow: 0px 0px 0px var(--border-color);
    }

    .btn-green {
      background-color: var(--btn-green);
      color: #fff;
    }

    .btn-dark {
      background-color: var(--btn-dark);
      color: #fff;
    }

    /* Secao de Lancamentos e Filtros */
    .section-box {
      border: 2px solid var(--border-color);
      background-color: var(--card-bg);
      padding: 16px;
      border-radius: 4px;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      font-weight: bold;
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 8px;
      margin-bottom: 12px;
    }

    .filter-group {
      margin-bottom: 12px;
    }

    .filter-group label {
      display: block;
      font-size: 0.75rem;
      font-weight: bold;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    select {
      width: 100%;
      padding: 8px;
      border: 2px solid var(--border-color);
      background-color: #fff;
      font-family: inherit;
      border-radius: 4px;
    }

    .status-footer {
      margin-top: 20px;
      text-align: center;
      font-size: 0.8rem;
      opacity: 0.7;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-top">
      <h1>Livro-Caixa</h1>
    </div>
    <div class="date-str" id="currentDateStr">QUINTA-FEIRA, 13 DE AGOSTO DE 2026</div>
    <div class="user-bar">
      <span id="userEmail">usuario@email.com</span>
      <button class="btn-sair" onclick="logout()">SAIR</button>
    </div>
  </header>

  <!-- Saldos / Bancos -->
  <div class="dashboard-grid" id="banksGrid">
    <div class="card total">
      <div class="card-title">SALDO TOTAL</div>
      <div class="card-value" id="saldoTotal">R$ 0,00</div>
    </div>
  </div>

  <!-- Ações -->
  <div class="actions-grid">
    <button class="btn btn-green" onclick="abrirModalLancamento()">+ NOVO LANÇAMENTO</button>
    <button class="btn" onclick="abrirModalBanco()">+ BANCO</button>
    <button class="btn" onclick="abrirModalCategoria()">+ CATEGORIA</button>
    <button class="btn" onclick="abrirModalTransferencia()">⇄ TRANSFERÊNCIA</button>
    <button class="btn" onclick="colarTexto()">COLAR TEXTO</button>
    <button class="btn" onclick="document.getElementById('filePdf').click()">IMPORTAR PDF</button>
    <button class="btn" onclick="exportarPDF()">EXPORTAR PDF</button>
    <button class="btn" onclick="exportarBackup()">EXPORTAR BACKUP</button>
    <button class="btn btn-dark" onclick="document.getElementById('fileBackup').click()">RESTAURAR BACKUP</button>
  </div>

  <!-- Inputs Invisíveis de Arquivo -->
  <input type="file" id="filePdf" accept=".pdf" style="display: none;" onchange="importarPDF(event)" />
  <input type="file" id="fileBackup" accept=".json" style="display: none;" onchange="restaurarBackup(event)" />

  <!-- Lista & Filtros -->
  <div class="section-box">
    <div class="section-header">
      <span>LANÇAMENTOS</span>
      <span id="qtdLancamentos">0</span>
    </div>

    <div class="filter-group">
      <label>MÊS</label>
      <select id="filterMes" onchange="renderApp()">
        <option value="">TODOS</option>
      </select>
    </div>

    <div class="filter-group">
      <label>BANCO</label>
      <select id="filterBanco" onchange="renderApp()">
        <option value="">TODOS</option>
      </select>
    </div>

    <div class="filter-group">
      <label>CATEGORIA</label>
      <select id="filterCategoria" onchange="renderApp()">
        <option value="">TODAS</option>
      </select>
    </div>

    <button class="btn" style="width: 100%; margin-top: 8px;" onclick="limparFiltros()">LIMPAR FILTROS</button>
    
    <div id="listaLancamentos" style="margin-top: 16px;"></div>
  </div>

  <div class="status-footer">
    livro-caixa • dados sincronizados com a nuvem pela sua conta
  </div>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, onSnapshot, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // INSIRA SUA CONFIGURAÇÃO DO FIREBASE AQUI
    const firebaseConfig = {
      apiKey: "SEU_API_KEY",
      authDomain: "SEU_PROJECT_ID.firebaseapp.com",
      projectId: "SEU_PROJECT_ID",
      storageBucket: "SEU_PROJECT_ID.appspot.com",
      messagingSenderId: "SEU_SENDER_ID",
      appId: "SEU_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // Estado da Aplicação
    window.user = null;
    window.dadosApp = {
      bancos: { "PAGBANK": 0, "PICPAY": 0, "MERCADO PAGO": 0, "DINHEIRO": 0 },
      categorias: ["Alimentação", "Transporte", "Moradia", "Outros"],
      lancamentos: []
    };

    let isRestoring = false; // Flag para ignorar snapshots conflitantes durante o backup

    // Monitor de Autenticação
    onAuthStateChanged(auth, (u) => {
      if (u) {
        window.user = u;
        document.getElementById("userEmail").innerText = u.email;
        escucharNuvem(u.uid);
      } else {
        // Se não autenticado, redireciona ou mantém estado local
        console.log("Usuário desconectado");
      }
    });

    // Escutar mudanças no Firestore em tempo real
    function escucharNuvem(uid) {
      const docRef = doc(db, "livro_caixa", uid);
      onSnapshot(docRef, (snapshot) => {
        if (isRestoring) return; // Ignora leituras enquanto o backup está sendo gravado

        if (snapshot.exists()) {
          window.dadosApp = snapshot.data();
          renderApp();
        } else {
          // Se não existir documento, salva o inicial
          persistNow(window.dadosApp);
        }
      });
    }

    // Gravação direta no Firestore
    window.persistNow = async function(dados) {
      if (!window.user) return;
      try {
        const docRef = doc(db, "livro_caixa", window.user.uid);
        await setDoc(docRef, dados);
        console.log("Dados sincronizados no Firestore!");
      } catch (err) {
        console.error("Erro ao gravar no Firestore:", err);
      }
    };

    // FUNÇÃO CORRIGIDA DE RESTAURAR BACKUP
    window.restaurarBackup = async function(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = async (e) => {
        try {
          isRestoring = true; // Ativa flag de bloqueio temporário
          const data = JSON.parse(e.target.result);

          // 1. Atualiza dados locais
          window.dadosApp = data;

          // 2. Grava IMEDIATAMENTE no Firebase
          if (window.user) {
            await window.persistNow(window.dadosApp);
          }

          // 3. Atualiza a Interface
          window.renderApp();

          // Reseta o input de arquivo
          event.target.value = '';

          alert("Backup restaurado e sincronizado com a nuvem com sucesso!");
        } catch (err) {
          console.error("Erro ao restaurar arquivo de backup:", err);
          alert("Falha ao ler o arquivo JSON de backup.");
        } finally {
          isRestoring = false; // Libera escuta da nuvem
        }
      };

      reader.readAsText(file);
    };

    // Renderização geral da UI
    window.renderApp = function() {
      const { bancos, lancamentos } = window.dadosApp;

      // 1. Calcular e renderizar saldos
      const grid = document.getElementById("banksGrid");
      grid.innerHTML = "";

      let total = 0;
      let htmlBancos = "";

      Object.entries(bancos || {}).forEach(([nome, saldo]) => {
        total += Number(saldo);
        htmlBancos += `
          <div class="card">
            <div class="card-title">${nome}</div>
            <div class="card-value">R$ ${Number(saldo).toFixed(2).replace('.', ',')}</div>
          </div>
        `;
      });

      grid.innerHTML = `
        <div class="card total">
          <div class="card-title">SALDO TOTAL</div>
          <div class="card-value">R$ ${total.toFixed(2).replace('.', ',')}</div>
        </div>
      ` + htmlBancos;

      // 2. Atualizar contadores e lista
      document.getElementById("qtdLancamentos").innerText = (lancamentos || []).length;
    };

    // Exportação de Backup JSON
    window.exportarBackup = function() {
      const jsonStr = JSON.stringify(window.dadosApp, null, 2);
      const blob = new Blob([jsonStr], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `backup-livro-caixa-${new Date().toISOString().slice(0,10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
    };

    window.logout = function() {
      signOut(auth).then(() => location.reload());
    };

    window.limparFiltros = function() {
      document.getElementById("filterMes").value = "";
      document.getElementById("filterBanco").value = "";
      document.getElementById("filterCategoria").value = "";
      window.renderApp();
    };

    // Stubs para funções de abertura de modais
    window.abrirModalLancamento = () => alert("Modal Novo Lançamento");
    window.abrirModalBanco = () => alert("Modal Novo Banco");
    window.abrirModalCategoria = () => alert("Modal Nova Categoria");
    window.abrirModalTransferencia = () => alert("Modal Transferência");
    window.colarTexto = () => alert("Cole seu texto aqui");
    window.importarPDF = (e) => alert("Importando arquivo PDF...");
    window.exportarPDF = () => alert("Gerando PDF...");

    // Render inicial
    window.renderApp();
  </script>
</body>
</html>
