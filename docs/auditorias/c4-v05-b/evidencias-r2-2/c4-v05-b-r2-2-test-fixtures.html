<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fixture de Teste C.4-V05-B-R2.2</title>
<style>
  /* Três ocorrências do mesmo seletor .test-btn */
  .test-btn {
    display: inline-block;
    padding: 8px 16px;
    background: #5F7A43;
    color: #FFF;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    margin: 4px;
  }
  .test-btn:hover {
    background: #7A9A57;
    color: #FFF;
  }
  .test-btn:focus-visible {
    outline: 3px solid #5F7A43;
    outline-offset: 2px;
  }
  .test-btn:active {
    background: #406030;
    color: #FFF;
  }
  .test-btn.hidden {
    display: none;
  }
  .test-btn.no-geom {
    position: absolute;
    width: 0;
    height: 0;
    overflow: hidden;
    visibility: hidden;
  }
  /* Elemento sem relação com --accent */
  .other-btn {
    display: inline-block;
    padding: 8px 16px;
    background: #CCC;
    color: #333;
    border: 1px solid #999;
    margin: 4px;
  }
</style>
</head>
<body>
  <!-- Três ocorrências do mesmo seletor .test-btn -->
  <button class="test-btn" id="btn-1">Botão 1 (visível)</button>
  <button class="test-btn" id="btn-2">Botão 2 (visível)</button>
  <button class="test-btn hidden" id="btn-3">Botão 3 (oculto)</button>
  <!-- Botão sem geometria (width/height = 0) -->
  <button class="test-btn no-geom" id="btn-4">Botão 4 (sem geometria)</button>
  <!-- Elemento de controle sem relação com --accent -->
  <button class="other-btn" id="btn-5">Botão outro</button>

  <script>
    // Expor funções para o teste CDP
    window.__testFixtures = {
      buttonIds: ['btn-1', 'btn-2', 'btn-3', 'btn-4', 'btn-5'],
      testSelector: '.test-btn'
    };
  </script>
</body>
</html>
