<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fixture de Teste C.4-V05-B-R2.4</title>
<style>
  :root {
    --accent: #5F7A43;
  }

  /* 1. Botão visível normal */
  .r24-btn-normal {
    display: inline-block;
    padding: 8px 16px;
    background: #FFFFFF;
    color: var(--accent);
    border: 2px solid var(--accent);
    border-radius: 4px;
    cursor: pointer;
    margin: 4px;
  }

  /* 2. Botão oculto com display:none */
  .r24-btn-hidden {
    display: none;
    padding: 8px 16px;
    background: #FFFFFF;
    color: var(--accent);
    border: 2px solid var(--accent);
    margin: 4px;
  }

  /* 3. Botão com visibility:hidden */
  .r24-btn-vishidden {
    visibility: hidden;
    padding: 8px 16px;
    background: #FFFFFF;
    color: var(--accent);
    border: 2px solid var(--accent);
    margin: 4px;
  }

  /* 4. Elemento com opacity:0 */
  .r24-btn-opacity0 {
    opacity: 0;
    padding: 8px 16px;
    background: #FFFFFF;
    color: var(--accent);
    border: 2px solid var(--accent);
    margin: 4px;
  }

  /* 5. Elemento sem dimensões */
  .r24-btn-no-dim {
    width: 0;
    height: 0;
    overflow: hidden;
    padding: 8px 16px;
    background: #FFFFFF;
    color: var(--accent);
    border: 2px solid var(--accent);
    margin: 4px;
  }

  /* 6. Elemento com borda de alto contraste */
  .r24-border-high {
    display: inline-block;
    padding: 8px 16px;
    background: #FFFFFF;
    color: #000000;
    border: 4px solid #000000;
    margin: 4px;
  }

  /* 7. Elemento com borda de baixo contraste */
  .r24-border-low {
    display: inline-block;
    padding: 8px 16px;
    background: #FFFFFF;
    color: #000000;
    border: 1px solid #EEEEEE;
    margin: 4px;
  }

  /* 8. Elemento com borda decorativa */
  .r24-border-decorative {
    display: inline-block;
    padding: 8px 16px;
    background: #FFFFFF;
    color: #000000;
    border: 1px dotted #CCCCCC;
    margin: 4px;
  }

  /* 9. Elemento com outline de foco */
  .r24-focus-outline {
    display: inline-block;
    padding: 8px 16px;
    background: #FFFFFF;
    color: #000000;
    border: 1px solid #999999;
    margin: 4px;
  }
  .r24-focus-outline:focus-visible {
    outline: 3px solid #5F7A43;
    outline-offset: 2px;
  }

  /* 10. Elemento com :hover */
  .r24-hover {
    display: inline-block;
    padding: 8px 16px;
    background: #FFFFFF;
    color: #000000;
    margin: 4px;
  }
  .r24-hover:hover {
    background: #5F7A43;
    color: #FFFFFF;
  }

  /* 11. Elemento com :focus */
  .r24-focus {
    display: inline-block;
    padding: 8px 16px;
    background: #FFFFFF;
    color: #000000;
    margin: 4px;
  }
  .r24-focus:focus {
    background: #5F7A43;
    color: #FFFFFF;
  }

  /* 12. Elemento com :active */
  .r24-active {
    display: inline-block;
    padding: 8px 16px;
    background: #FFFFFF;
    color: #000000;
    margin: 4px;
  }
  .r24-active:active {
    background: #406030;
    color: #FFFFFF;
  }

  /* 13. Elemento com !important */
  .r24-important {
    display: inline-block;
    padding: 8px 16px;
    background: #FFFFFF;
    color: #000000 !important;
    margin: 4px;
  }

  /* 14. Elemento com declaração inline */
  .r24-inline {
    display: inline-block;
    padding: 8px 16px;
    background: #FFFFFF;
    color: #000000;
    margin: 4px;
  }

  /* 15. Elemento com seletor de maior especificidade */
  .r24-specificity {
    display: inline-block;
    padding: 8px 16px;
    background: #FFFFFF;
    color: #000000;
    margin: 4px;
  }
  button.r24-specificity {
    color: var(--accent);
  }

  /* 16. Elemento com propriedade herdada */
  .r24-inherit {
    display: inline-block;
    padding: 8px 16px;
    background: #FFFFFF;
    color: inherit;
    margin: 4px;
  }
  .r24-inherit-parent {
    color: var(--accent);
  }

  /* 17. SVG com fill */
  .r24-svg-fill {
    display: inline-block;
    margin: 4px;
  }
  .r24-svg-fill svg {
    fill: var(--accent);
    width: 24px;
    height: 24px;
  }

  /* 18. SVG com stroke */
  .r24-svg-stroke {
    display: inline-block;
    margin: 4px;
  }
  .r24-svg-stroke svg {
    fill: none;
    stroke: var(--accent);
    stroke-width: 2;
    width: 24px;
    height: 24px;
  }

  /* 19. Elemento com currentColor */
  .r24-currentcolor {
    display: inline-block;
    padding: 8px 16px;
    background: #FFFFFF;
    color: var(--accent);
    border: 1px solid currentColor;
    margin: 4px;
  }

  /* 20. Elemento rotacionado para testar geometria */
  .r24-rotated {
    display: inline-block;
    padding: 8px 16px;
    background: #FFFFFF;
    color: #000000;
    border: 2px solid #000000;
    margin: 4px;
    transform: rotate(15deg);
  }

  /* Elemento de controle sem relação com --accent */
  .r24-other {
    display: inline-block;
    padding: 8px 16px;
    background: #CCCCCC;
    color: #333333;
    border: 1px solid #999999;
    margin: 4px;
  }
</style>
</head>
<body>
  <div class="r24-inherit-parent">
    <!-- 16. Elemento com propriedade herdada -->
    <span class="r24-inherit">Texto herdado</span>
  </div>

  <!-- 1. Botão visível normal -->
  <button class="r24-btn-normal" id="r24-btn-1">Botão normal</button>

  <!-- 2. Botão oculto com display:none -->
  <button class="r24-btn-hidden" id="r24-btn-2">Botão oculto</button>

  <!-- 3. Botão com visibility:hidden -->
  <button class="r24-btn-vishidden" id="r24-btn-3">Botão visibility hidden</button>

  <!-- 4. Elemento com opacity:0 -->
  <button class="r24-btn-opacity0" id="r24-btn-4">Botão opacity 0</button>

  <!-- 5. Elemento sem dimensões -->
  <button class="r24-btn-no-dim" id="r24-btn-5">Botão sem dimensões</button>

  <!-- 6. Elemento com borda de alto contraste -->
  <button class="r24-border-high" id="r24-btn-6">Borda alto contraste</button>

  <!-- 7. Elemento com borda de baixo contraste -->
  <button class="r24-border-low" id="r24-btn-7">Borda baixo contraste</button>

  <!-- 8. Elemento com borda decorativa -->
  <button class="r24-border-decorative" id="r24-btn-8">Borda decorativa</button>

  <!-- 9. Elemento com outline de foco -->
  <button class="r24-focus-outline" id="r24-btn-9">Outline foco</button>

  <!-- 10. Elemento com :hover -->
  <button class="r24-hover" id="r24-btn-10">Hover</button>

  <!-- 11. Elemento com :focus -->
  <button class="r24-focus" id="r24-btn-11">Focus</button>

  <!-- 12. Elemento com :active -->
  <button class="r24-active" id="r24-btn-12">Active</button>

  <!-- 13. Elemento com !important -->
  <button class="r24-important" id="r24-btn-13">Important</button>

  <!-- 14. Elemento com declaração inline (style attribute) -->
  <button class="r24-inline" id="r24-btn-14" style="color: #FF0000;">Inline cor</button>

  <!-- 15. Elemento com seletor de maior especificidade -->
  <button class="r24-specificity" id="r24-btn-15">Specificity</button>

  <!-- 17. SVG com fill -->
  <div class="r24-svg-fill" id="r24-btn-17">
    <svg viewBox="0 0 24 24"><rect width="20" height="20" x="2" y="2" /></svg>
  </div>

  <!-- 18. SVG com stroke -->
  <div class="r24-svg-stroke" id="r24-btn-18">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" /></svg>
  </div>

  <!-- 19. Elemento com currentColor -->
  <button class="r24-currentcolor" id="r24-btn-19">CurrentColor</button>

  <!-- 20. Elemento rotacionado para testar geometria -->
  <button class="r24-rotated" id="r24-btn-20">Rotacionado</button>

  <!-- Elemento de controle sem relação com --accent -->
  <button class="r24-other" id="r24-btn-21">Outro</button>

  <script>
    window.__r24Fixtures = {
      buttonIds: [
        'r24-btn-1', 'r24-btn-2', 'r24-btn-3', 'r24-btn-4', 'r24-btn-5',
        'r24-btn-6', 'r24-btn-7', 'r24-btn-8', 'r24-btn-9', 'r24-btn-10',
        'r24-btn-11', 'r24-btn-12', 'r24-btn-13', 'r24-btn-14', 'r24-btn-15',
        'r24-btn-17', 'r24-btn-18', 'r24-btn-19', 'r24-btn-20', 'r24-btn-21'
      ],
      testSelector: '.r24-btn-normal'
    };
  </script>
</body>
</html>
