name = "livro-caixa-ai"
main = "src/index.js"
compatibility_date = "2026-09-24"
workers_dev = true

# A chave da API NÃO fica aqui. Definida com:
#   npx wrangler secret put OPENROUTER_API_KEY

# KV namespaces para cota e rate limit distribuídos
# Criar com: npx wrangler kv:namespace create "QUOTA_KV" && npx wrangler kv:namespace create "RATE_LIMIT_KV"
[[kv_namespaces]]
binding = "QUOTA_KV"
id = "0a525c61a6fb461aade806ab07a0282a"
preview_id = "0a525c61a6fb461aade806ab07a0282a"

[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "ab4265ca7efc4e379c5b0bce1d6cb42e"
preview_id = "ab4265ca7efc4e379c5b0bce1d6cb42e"

[vars]
FIREBASE_PROJECT_ID = "livro-caixa-54357"
# Adicionar domínio de produção (ex: https://livrocaixa.app, https://app.livrocaixa.com)
ALLOW_ORIGINS = "http://127.0.0.1:8000,http://localhost:8000,https://antvjpg.github.io,https://livrocaixa.app"
OPENROUTER_MODELS = "google/gemma-4-26b-a4b-it:free,nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free,qwen/qwen3.8-27b:free,google/gemma-4-31b-it:free"
AI_RATE_LIMIT_PER_MINUTE = "30"
# Consultas externas por minuto por IP/origem nas rotas /financial (públicas).
FINANCIAL_RATE_LIMIT_PER_MINUTE = "20"
